<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d2a35">
<meta name="description" content="Cómo se mueve Tierra Bomba: el mar que conecta, la vida y sus relaciones, el agua, la historia y lo que falta por contar, en un modelo 3D de la isla.">
<title>Así se mueve Tierra Bomba</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="isla.css">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script>
<script type="module" src="isla.js"></script>
</head>
<body data-ch="isla">
<header class="brand">
  <p class="over">Tierra Bomba, Cartagena</p>
  <h1>Así se mueve Tierra Bomba</h1>
</header>

<nav class="chapters" id="chapters" aria-label="Capítulos"></nav>

<main class="stage">
  <div class="view">
    <div id="model" role="application" aria-label="Modelo tridimensional de Tierra Bomba. Arrastra para girar, pellizca o usa la rueda para acercar."></div>
    <canvas id="flow" aria-hidden="true"></canvas>
    <p class="loading" id="loading" role="status">Cargando la isla…</p>
  </div>
  <div class="tools" aria-label="Controles del modelo">
    <button id="zin" aria-label="Acercar">+</button>
    <button id="zout" aria-label="Alejar">−</button>
    <button id="tilt">Desde arriba</button>
    <button id="reset">Volver</button>
  </div>
  <aside class="card" id="card" aria-live="polite"></aside>
</main>

<section class="story" id="story" aria-live="polite"></section>

<noscript><p class="noscript">Esta página necesita JavaScript para mostrar el modelo 3D de la isla.</p></noscript>
</body>
</html>
