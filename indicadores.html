<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Indicadores ráster | Tierra Bomba</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"><style>
:root{font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#09222c;background:#f6faf9}*{box-sizing:border-box}body{margin:0;-webkit-font-smoothing:antialiased}button,input,select{font:inherit}button,a,select{cursor:pointer}a{color:#0f766e;text-decoration:none}a:hover{color:#09524d;text-decoration:underline}header{padding:20px 32px;background:linear-gradient(180deg,#061922 0%,#09222c 100%);color:#fff;border-bottom:1px solid rgba(255,255,255,.08);display:flex;justify-content:space-between;align-items:center;gap:20px;position:relative}header::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,#14b8a6,#e59d18,#c86d51)}header small{color:#92babc;letter-spacing:.14em;font-size:10px;font-weight:700;text-transform:uppercase}h1{font-family:'Playfair Display',Georgia,serif;font-size:28px;margin:5px 0 0;letter-spacing:-.02em;color:#fff}header a{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.2);padding:9px 15px;border-radius:12px;font-size:13px;font-weight:600;transition:all .2s ease}header a:hover{background:#fff;color:#09222c;transform:translateY(-1px);text-decoration:none}nav{display:flex;gap:8px;flex-wrap:wrap;padding:12px 32px;background:#fff;border-bottom:1px solid #d5e0dd;box-shadow:0 2px 4px rgba(11,37,48,.03)}nav button{border:1px solid #d5e0dd;border-radius:20px;padding:8px 16px;background:#ffffff;color:#09222c;font-weight:600;font-size:13px;box-shadow:0 1px 3px rgba(11,37,48,.04);transition:all .2s cubic-bezier(.16,1,.3,1)}nav button:hover{border-color:#0f766e;transform:translateY(-1px);box-shadow:0 4px 10px rgba(15,118,110,.15)}nav button[aria-pressed=true]{background:linear-gradient(135deg,#09222c 0%,#113644 100%);color:#fff;border-color:#09222c;box-shadow:0 4px 12px rgba(9,34,44,.25)}main{display:grid;grid-template-columns:minmax(0,1fr) 380px;min-height:calc(100dvh - 160px)}.visual{background:#dbe6e4;position:relative;min-height:60vh;display:grid;grid-template-rows:1fr auto}.viewport{position:relative;overflow:hidden;min-height:400px;height:calc(100dvh - 230px)}.viewport img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}.viewport #raster{clip-path:inset(0 0 0 var(--swipe,0%))}.controls{padding:14px 28px;background:rgba(255,255,255,.94);backdrop-filter:blur(16px);border-top:1px solid #d5e0dd;display:flex;align-items:center;gap:18px;flex-wrap:wrap;font-size:13px;box-shadow:0 -4px 16px rgba(11,37,48,.03)}.controls input{max-width:150px}.controls label{display:flex;gap:8px;align-items:center;font-weight:500}.controls button{border:1px solid #d5e0dd;border-radius:10px;padding:8px 14px;background:#ffffff;font-weight:600;font-size:12.5px;box-shadow:0 1px 3px rgba(11,37,48,.04);transition:all .2s ease}.controls button:hover{border-color:#0f766e;transform:translateY(-1px)}.controls a#original{font-weight:600;font-size:13px}aside{padding:28px 24px;overflow-y:auto;max-height:calc(100dvh - 160px);font-size:13.5px;line-height:1.6;border-left:1px solid #d5e0dd;background:#fbfdfc;scrollbar-width:thin;scrollbar-color:#cbd8d6 transparent}h2{font-family:'Playfair Display',Georgia,serif;font-size:24px;line-height:1.2;margin:0 0 16px;color:#09222c;letter-spacing:-.015em}h3{font-family:'Plus Jakarta Sans',sans-serif;font-size:13.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#09222c;margin:22px 0 10px}p{margin:10px 0;color:#45626c}.note{padding:14px 16px;background:linear-gradient(145deg,#ffffff 0%,#f0f7f5 100%);border:1px solid rgba(15,118,110,.25);border-left:4px solid #0f766e;border-radius:12px;box-shadow:0 2px 6px rgba(11,37,48,.04);color:#09222c;font-size:13px;line-height:1.55}.legend{display:flex;gap:10px;align-items:center;margin:8px 0;background:#ffffff;border:1px solid #d5e0dd;border-radius:10px;padding:8px 12px;box-shadow:0 1px 3px rgba(11,37,48,.03)}.legend i{height:14px;width:14px;flex-shrink:0;border-radius:3px;border:1px solid #11354233}.metric{padding:12px 14px;border:1px solid #d5e0dd;background:#f </style></head><body><header><div><small>TIERRA BOMBA / ARCHIVO DE TESIS</small><h1>Indicadores e imágenes ráster</h1></div><a href="./">Volver a la isla ↗</a></header><nav id="bands" aria-label="Indicadores del proyecto"></nav><main><section class="visual" aria-label="Comparador de imágenes"><div class="viewport"><img id="optical" alt="Imagen óptica de contexto del archivo de tesis"><img id="raster" alt=""><span id="image-status" role="status">Cargando imagen…</span></div><div class="controls"><button id="compare" aria-pressed="false">Comparar con imagen óptica</button><label id="swipe-label" hidden>Barrido <input id="swipe" aria-label="Posición de comparación" type="range" min="0" max="100" value="50"></label><label>Opacidad <input id="opacity" aria-label="Opacidad del ráster" type="range" min="0" max="100" value="100"></label><a id="original" target="_blank" rel="noopener">Abrir imagen original ↗</a></div></section><aside id="sheet"></aside></main>
