<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Indicadores ráster | Tierra Bomba</title><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"><style>
:root{font-family:'Space Grotesk',system-ui,sans-serif;color:#113542;background:#fffefa}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button,a,select{cursor:pointer}a{color:inherit}header{padding:20px 28px;border-bottom:1px solid #dbe4dc;display:flex;justify-content:space-between;align-items:center;gap:20px}header small{color:#0f766e;letter-spacing:.12em;font-size:10px}h1{font-size:28px;margin:7px 0 0;letter-spacing:-.04em}nav{display:flex;gap:8px;flex-wrap:wrap;padding:12px 28px;border-bottom:1px solid #dbe4dc}button{border:1px solid #dbe4dc;border-radius:5px;padding:10px 14px;background:#fffefa;color:#113542}button[aria-pressed=true]{background:#113542;color:#fffefa}main{display:grid;grid-template-columns:minmax(0,1fr) 350px;min-height:calc(100dvh - 160px)}.visual{background:#e9e5d9;position:relative;min-height:60vh;display:grid;grid-template-rows:1fr auto}.viewport{position:relative;overflow:hidden;min-height:400px;height:calc(100dvh - 230px)}.viewport img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}.viewport #raster{clip-path:inset(0 0 0 var(--swipe,0%))}.controls{padding:12px 24px;background:#fffefa;display:flex;align-items:center;gap:16px;flex-wrap:wrap;font-size:12px}.controls input{max-width:150px}.controls label{display:flex;gap:8px;align-items:center}aside{padding:24px;overflow:auto;max-height:calc(100dvh - 160px);font-size:12px;line-height:1.65;border-left:1px solid #dbe4dc}h2{font-size:20px;line-height:1.2;margin:0 0 16px}h3{font-size:13px;margin:22px 0 10px}p{margin:10px 0}.note{padding:12px;background:#f0f4ee;border-left:3px solid #0f766e}.legend{display:flex;gap:9px;align-items:center;margin:8px 0}.legend i{height:12px;width:12px;flex-shrink:0;border:1px solid #11354233}.metric{padding:9px 0;border-bottom:1px solid #dbe4dc;display:flex;justify-content:space-between;gap:18px}.metric strong{text-align:right}#image-status{position:absolute;bottom:15px;left:15px;background:#fffefa;padding:8px 12px;font-size:11px;max-width:90%}[hidden]{display:none!important}a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid #c86d51;outline-offset:3px}@media(max-width:800px){header{padding:16px}h1{font-size:22px}nav{padding:12px 16px}nav button{padding:8px;font-size:11px}main{grid-template-columns:1fr}.viewport{height:60vh;min-height:300px}aside{max-height:none;border-left:0;border-top:1px solid #dbe4dc}.controls{padding:12px 16px}}
</style></head><body><header><div><small>TIERRA BOMBA / ARCHIVO DE TESIS</small><h1>Indicadores e imágenes ráster</h1></div><a href="./">Volver a la isla ↗</a></header><nav id="bands" aria-label="Indicadores del proyecto"></nav><main><section class="visual" aria-label="Comparador de imágenes"><div class="viewport"><img id="optical" alt="Imagen óptica de contexto del archivo de tesis"><img id="raster" alt=""><span id="image-status" role="status">Cargando imagen…</span></div><div class="controls"><button id="compare" aria-pressed="false">Comparar con imagen óptica</button><label id="swipe-label" hidden>Barrido <input id="swipe" aria-label="Posición de comparación" type="range" min="0" max="100" value="50"></label><label>Opacidad <input id="opacity" aria-label="Opacidad del ráster" type="range" min="0" max="100" value="100"></label><a id="original" target="_blank" rel="noopener">Abrir imagen original ↗</a></div></section><aside id="sheet"></aside></main>
<script type="module" src="indicadores.mjs?v=restore-3"></script></body></html>
